<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Security policy, for the desktop and phone versions alike: only the app's own files may run, and the
       network is limited to Nearby Sync's introduction server (PeerJS). Updates and links go through the
       desktop app itself. It's set here rather than in tauri.conf.json (app.security.csp) because that one
       would also apply to vendor/viewer/heic-frame.html, which has its own, separate policy. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' blob:; connect-src 'self' ipc: http://ipc.localhost https://0.peerjs.com wss://0.peerjs.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Point Tracker</title>
  <!-- Home Screen app (web version) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="vendor/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Point Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#071229">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/lucide.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="overlay"></div>
</body>
</html>
