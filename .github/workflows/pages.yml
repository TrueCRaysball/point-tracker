# Publishes the Home Screen (web) version of Point Tracker to GitHub Pages when a push to main changes the app.
# (Docs, packaging and desktop-only changes don't redeploy, so phones don't get "Update ready" for nothing.)
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# The site holds only the app's files. Each person's data stays on their own device.
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "sample/**"
      - "scripts/web.mjs"
      - "scripts/vendor.mjs"
      - "scripts/stamp.mjs"
      - "tools/web/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
