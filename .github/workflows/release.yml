# Builds Point Tracker for every supported platform and attaches the installers to a draft GitHub release.
# Trigger: push a tag like v1.2.0, or run it from the Actions tab. Run by hand, give an existing tag
# (e.g. v1.8.0) to redo that release, or leave it empty for a test build.
#
# 1. One draft release is created first, so every platform uploads into the same one.
# 2. Each platform builds, signs its update package and uploads its files.
# 3. latest.json (what installed apps read to update themselves) is written once at the end, from all
#    the signed packages, so no platform can be left out.
#
# Signing needs two repository secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (see README, "Updates").
#
# Supported: macOS Apple Silicon · Windows 64-bit and 32-bit · Linux 64-bit (x86_64 and ARM64).
# Builds are unsigned for now; see README for first-launch steps.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.8.0). Leave empty for a test build."
        required: false

permissions:
  contents: write

env:
  # Build numbers use the maintainer's local time (YYMMDDHHmm).
  TZ: America/New_York

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          build=$(node scripts/stamp.mjs)
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"
          else tag="v${version}-build.${build}"; fi
          cat > notes.md <<EOF
          **Point Tracker Beta ${version}** (build ${build})

          Already have 1.8.0 or newer on your computer? It updates itself; you'll see a notice when this version is out.

          Download the file for your computer:
          - **Mac (Apple Silicon, M1 or newer):** \`.dmg\`
          - **Windows 64-bit:** \`x64-setup.exe\` (or \`x64_en-US.msi\`)
          - **Windows 32-bit:** \`x86-setup.exe\` (or \`x86_en-US.msi\`)
          - **Linux x86_64:** \`amd64.AppImage\`, \`amd64.deb\` or \`x86_64.rpm\`
          - **Linux ARM64:** \`aarch64.AppImage\`, \`arm64.deb\` or \`aarch64.rpm\`

          These builds are not code-signed yet, so your computer will warn you the first time.
          See the README for how to open it.

          Not affiliated with or endorsed by The Walt Disney Company (TWDC).
          EOF
          gh release create "$tag" --draft --title "Point Tracker Beta ${version}" --notes-file notes.md --target "${{ github.sha }}"
          id=$(gh api "repos/${{ github.repository }}/releases" --jq "map(select(.tag_name == \"$tag\" and .draft)) | first | .id")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg # "app" makes the .app.tar.gz update package
          - name: Windows 64-bit
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows 32-bit
            runner: windows-latest
            target: i686-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Stamp build number
        run: node scripts/stamp.mjs --updater

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: false # written once, after every platform (next job)
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.build.conf.json

  latest-json:
    name: Write latest.json
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/latest-json.mjs "${{ needs.draft.outputs.tag }}"
